name: Build Unsigned .app + .ipa (Sideloading Ready)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-unsigned:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Latest Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Build Unsigned Archive (no signing)
      run: |
        xcodebuild clean archive \
          -project EnsWilde.xcodeproj \
          -scheme EnsWilde \
          -configuration Release \
          -archivePath "$PWD/EnsWilde.xcarchive" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_IDENTITY="" \
          DEVELOPMENT_TEAM="" \
          PROVISIONING_PROFILE_SPECIFIER="" \
          ONLY_ACTIVE_ARCH=NO \
          ENABLE_BITCODE=NO

    - name: Extract Unsigned .app
      run: |
        APP_PATH="EnsWilde.xcarchive/Products/Applications/EnsWilde.app"
        if [ ! -d "$APP_PATH" ]; then
          echo "Error: .app not found"
          exit 1
        fi
        cp -r "$APP_PATH" ./EnsWilde.app
        echo "✅ Unsigned .app ready"

    - name: Create Unsigned .ipa
      run: |
        mkdir -p Payload
        cp -r EnsWilde.app Payload/
        find Payload -name ".DS_Store" -delete || true
        zip -r EnsWilde-unsigned.ipa Payload
        rm -rf Payload EnsWilde.app EnsWilde.xcarchive
        echo "✅ Unsigned .ipa created: $(ls -lh EnsWilde-unsigned.ipa)"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: EnsWilde-unsigned.ipa
        path: EnsWilde-unsigned.ipa
        retention-days: 30

    - name: Summary
      run: |
        echo "## ✅ Build Complete" >> $GITHUB_STEP_SUMMARY
        echo "- Unsigned .ipa ready for TrollStore / Impactor / Sideloadly" >> $GITHUB_STEP_SUMMARY
        echo "- No code signing used (hobby project)" >> $GITHUB_STEP_SUMMARY